<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carregando a Central de Automação…</title>
<style>
  body { margin:0; display:flex; align-items:center; justify-content:center; height:100vh;
         background:#15171c; color:#e9edf2; font-family:system-ui,Arial,sans-serif;
         font-size:15px; text-align:center; padding:20px; }
</style>
</head>
<body>
<div id="recado">Carregando a Central de Automação…</div>
<script>
// Esta janelinha existe por um motivo só: alguns portais proíbem a própria
// página de buscar arquivos de fora. Aqui, dentro do GitHub, essa busca é
// permitida. Então ela pega o central.js e devolve o texto para a página do
// portal por recado entre janelas, que nenhuma regra de segurança barra.
(function () {
    var recado = document.getElementById('recado');
    function avisar(msg) { recado.textContent = msg; }
    function responder(dados) {
        try {
            if (window.opener) window.opener.postMessage(dados, '*');
        } catch (e) { }
    }
    if (!window.opener) {
        avisar('Esta janela é usada pelo favorito Robôs. Não precisa abrir ela à mão.');
        return;
    }
    fetch('central.js?v=' + Date.now())
        .then(function (r) {
            if (!r.ok) throw new Error('resposta ' + r.status);
            return r.text();
        })
        .then(function (codigo) {
            responder({ tipo: 'central-robos', codigo: codigo });
            avisar('Pronto. Pode fechar esta janela.');
            setTimeout(function () { try { window.close(); } catch (e) { } }, 400);
        })
        .catch(function (e) {
            responder({ tipo: 'central-robos-erro', erro: e.message });
            avisar('Não consegui pegar o arquivo: ' + e.message);
        });
})();
</script>
</body>
</html>
